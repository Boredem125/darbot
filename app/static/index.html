<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dar Bot - Property Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="site-header" role="banner">
    <div class="header-inner">
      <div class="header-brand">
        <div class="logo-mark" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect width="28" height="28" rx="7" fill="currentColor" class="logo-bg"/>
            <path d="M7 20V10l7-4v14M21 20V12l-7-4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <h1 class="header-title">Dar Bot</h1>
          <p class="header-subtitle">Property assistant for Wasalt &amp; DarGlobal</p>
        </div>
      </div>
    </div>
  </header>

  <main id="main-content" role="main">
    <div class="conversation" id="conversation" role="log" aria-label="Chat conversation">
      <div id="empty-state" class="empty-state">
        <div class="hero">
          <div class="hero-icon" aria-hidden="true">
            <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
              <circle cx="28" cy="28" r="28" fill="currentColor" class="hero-circle"/>
              <path d="M16 40V22l12-7v25M40 40V26l-12-7" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="24" cy="28" r="1.5" fill="#fff"/><circle cx="24" cy="33" r="1.5" fill="#fff"/>
              <circle cx="32" cy="31" r="1.5" fill="#fff"/><circle cx="32" cy="36" r="1.5" fill="#fff"/>
            </svg>
          </div>
          <h2 class="hero-title">Find your perfect property</h2>
          <p class="hero-subtitle">Search thousands of listings across Saudi Arabia and the GCC</p>
        </div>
        <div class="example-grid" role="list" aria-label="Example queries">
          <button type="button" class="example-card" role="listitem"
                  data-query="3-bed villas in Riyadh under 2M SAR">
            <span class="example-icon" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/></svg>
            </span>
            <span class="example-text">3-bed villas in Riyadh under 2M SAR</span>
          </button>
          <button type="button" class="example-card" role="listitem"
                  data-query="cheapest apartment for rent in Jeddah">
            <span class="example-icon" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 22h20"/><path d="M6 22V4a2 2 0 012-2h8a2 2 0 012 2v18"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/></svg>
            </span>
            <span class="example-text">Cheapest apartment for rent in Jeddah</span>
          </button>
          <button type="button" class="example-card" role="listitem"
                  data-query="When is Trump Tower Jeddah handed over?">
            <span class="example-icon" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            </span>
            <span class="example-text">When is Trump Tower Jeddah handed over?</span>
          </button>
          <button type="button" class="example-card" role="listitem" dir="rtl"
                  data-query="شقق للإيجار في جدة">
            <span class="example-icon" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
            </span>
            <span class="example-text">شقق للإيجار في جدة</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <div class="input-area" role="form" aria-label="Send a message">
    <div class="input-inner">
      <label for="message-input" class="sr-only">Your question</label>
      <div class="input-wrapper">
        <textarea
          id="message-input"
          class="input-field"
          dir="auto"
          rows="1"
          maxlength="500"
          placeholder="Ask about properties..."
          aria-describedby="char-count"
        ></textarea>
        <button type="button" id="btn-send" class="btn-action btn-send" aria-label="Send message">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/>
          </svg>
        </button>
        <button type="button" id="btn-stop" class="btn-action btn-stop" aria-label="Stop generating" hidden>
          Stop
        </button>
      </div>
      <span id="char-count" class="char-counter" aria-live="polite">0 / 500</span>
    </div>
  </div>

  <div id="sr-announce" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <footer class="site-footer" role="contentinfo">
    <p>AI-generated answers may contain errors. Not financial or legal advice.</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
