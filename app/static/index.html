<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wasalt / DarGlobal Property Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="site-header" role="banner">
    <div class="header-inner">
      <h1 class="header-title">Property Assistant</h1>
      <p class="header-subtitle">Wasalt listings &amp; DarGlobal projects across Saudi Arabia and the GCC</p>
    </div>
  </header>

  <main id="main-content" role="main">
    <div class="conversation" id="conversation" role="log" aria-label="Chat conversation">
      <div id="empty-state" class="empty-state">
        <div class="empty-icon" aria-hidden="true">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 21h18"/><path d="M5 21V7l8-4v18"/>
            <path d="M19 21V11l-6-4"/>
            <path d="M9 9v.01"/><path d="M9 12v.01"/><path d="M9 15v.01"/><path d="M9 18v.01"/>
          </svg>
        </div>
        <p class="empty-title">Ask about properties</p>
        <p class="empty-subtitle">Try one of these:</p>
        <div class="example-queries" role="list" aria-label="Example queries">
          <button type="button" class="example-query" role="listitem"
                  data-query="3-bed villas in Riyadh under 2M SAR">3-bed villas in Riyadh under 2M SAR</button>
          <button type="button" class="example-query" role="listitem"
                  data-query="cheapest apartment for rent in Jeddah">cheapest apartment for rent in Jeddah</button>
          <button type="button" class="example-query" role="listitem"
                  data-query="When is Trump Tower Jeddah handed over?">When is Trump Tower Jeddah handed over?</button>
          <button type="button" class="example-query" role="listitem" dir="rtl"
                  data-query="شقق للإيجار في جدة">شقق للإيجار في جدة</button>
        </div>
      </div>
    </div>
  </main>

  <div class="input-area" role="form" aria-label="Send a message">
    <div class="input-inner">
      <label for="message-input" class="sr-only">Your question</label>
      <div class="input-wrapper">
        <textarea
          id="message-input"
          class="input-field"
          dir="auto"
          rows="1"
          maxlength="500"
          placeholder="Ask about properties..."
          aria-describedby="char-count"
        ></textarea>
        <button type="button" id="btn-send" class="btn-send" aria-label="Send message">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/>
          </svg>
        </button>
        <button type="button" id="btn-stop" class="btn-stop" aria-label="Stop generating" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="4" y="4" width="16" height="16" rx="3"/>
          </svg>
        </button>
      </div>
      <span id="char-count" class="char-counter" aria-live="polite">0 / 500</span>
    </div>
  </div>

  <div id="sr-announce" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <footer class="site-footer" role="contentinfo">
    <p>AI-generated answers may contain errors. Not financial or legal advice.</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
