<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wasalt / DarGlobal Property Assistant</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="site-header" role="banner">
    <h1>Wasalt / DarGlobal Property Assistant</h1>
    <p>Listings from Wasalt and projects from DarGlobal. Listing data is as of its scrape date.</p>
  </header>

  <main id="main-content" role="main">
    <div class="conversation" id="conversation" role="log" aria-label="Chat conversation">
      <!-- turns are appended here -->
    </div>
  </main>

  <div class="input-area" role="form" aria-label="Send a message">
    <label for="message-input" class="input-label">Your question</label>
    <div class="input-wrapper">
      <div class="input-field-wrap">
        <textarea
          id="message-input"
          class="input-field"
          dir="auto"
          rows="1"
          maxlength="500"
          placeholder="Ask about properties, e.g. 3-bed villas in Riyadh under 2M SAR"
          aria-describedby="char-count"
        ></textarea>
        <span id="char-count" class="char-counter" aria-live="polite">0 / 500</span>
      </div>
      <button type="button" id="btn-send" class="btn-send" aria-label="Send message">Send</button>
      <button type="button" id="btn-stop" class="btn-stop" aria-label="Stop generating" hidden>Stop</button>
    </div>
  </div>

  <!-- Live region for screen readers: announced on end -->
  <div id="sr-announce" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <footer class="site-footer" role="contentinfo">
    <p>Answers are generated by an AI model and may contain errors. This is not financial or legal advice.</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
